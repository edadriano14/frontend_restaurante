<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Palavra-passe - {{ estabelecimento.nome }}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="theme-color" content="{{ estabelecimento.cor_primaria }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --cor-primaria: {{ estabelecimento.cor_primaria }};
            --cor-secundaria: {{ estabelecimento.cor_secundaria }};
        }
        .bg-custom-primary { background-color: var(--cor-primaria); }
        .text-custom-primary { color: var(--cor-primaria); }
        .border-custom-primary { border-color: var(--cor-primaria); }
        .bg-restaurant {
            background-image: linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.82)),
                              url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-restaurant min-h-screen flex items-center justify-center p-4 font-sans antialiased text-gray-800">

    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 sm:p-10 border border-white/40">
        
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-600 flex items-center justify-center mx-auto mb-3 shadow-sm text-2xl font-black border border-amber-200">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-900 tracking-tight">Recuperar Palavra-passe</h1>
            <p class="text-sm text-gray-500 mt-1">Introduza o seu email cadastrado para redefinir o seu acesso.</p>
        </div>

        {% if erro %}
        <div class="mb-5 p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-center gap-2.5">
            <i class="fa-solid fa-circle-exclamation text-red-600 text-base flex-shrink-0"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        {% if mensagem %}
        <div class="mb-5 p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold flex items-center gap-2.5">
            <i class="fa-solid fa-circle-check text-emerald-600 text-base flex-shrink-0"></i>
            <span>{{ mensagem }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/recuperar-senha" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Email Cadastrado</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="seu.email@restaurante.com" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm outline-none focus:bg-white focus:border-custom-primary focus:ring-4 focus:ring-red-500/10 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-custom-primary hover:opacity-95 text-white font-bold rounded-2xl shadow-lg shadow-red-600/20 transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                <span>Enviar Instruções de Redefinição</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <div class="text-center mt-6 pt-5 border-t border-gray-100">
            <a href="/login" class="text-xs text-gray-600 hover:text-custom-primary font-bold inline-flex items-center gap-1.5 transition">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para o Início de Sessão
            </a>
        </div>
    </div>

</body>
</html>
