{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Dados de Clientes</h1>
            <p class="text-gray-500">Histórico, preferências e contactos de clientes do restaurante.</p>
        </div>
        <button onclick="abrirModalCliente()" class="px-4 py-2 bg-custom-primary text-white rounded-lg font-semibold shadow hover:opacity-90 flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-plus"></i> Novo Cliente
        </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-50 text-gray-700 uppercase font-semibold text-xs border-b">
                <tr>
                    <th class="p-4">Código</th>
                    <th class="p-4">Nome do Cliente</th>
                    <th class="p-4">Telemóvel</th>
                    <th class="p-4">NUIT</th>
                    <th class="p-4">Endereço / Morada</th>
                    <th class="p-4">Email</th>
                    <th class="p-4">Observações</th>
                    <th class="p-4 text-right">Acções</th>
                </tr>
            </thead>
            <tbody id="tabelaClientes" class="divide-y divide-gray-100"></tbody>
        </table>
    </div>

    <!-- Modal CRUD Cliente -->
    <div id="modalCliente" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 id="modalClienteTitulo" class="font-bold text-lg text-gray-800">Novo Cliente</h3>
                <button type="button" onclick="fecharModal('modalCliente')" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div class="space-y-3">
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Código *</label>
                        <input type="text" id="cliCodigo" placeholder="CLI-01" class="w-full px-3 py-2 border rounded-lg text-sm font-mono font-bold uppercase bg-gray-50 outline-none">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nome do Cliente *</label>
                        <input type="text" id="cliNome" placeholder="Ex: Artur Mondlane" class="w-full px-3 py-2 border rounded-lg text-sm font-semibold outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Telemóvel / Contacto *</label>
                        <input type="text" id="cliTelefone" placeholder="+258 84 000 0000" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">NUIT (Moçambique)</label>
                        <input type="text" id="cliNuit" maxlength="10" placeholder="1009876543 (Opcional)" class="w-full px-3 py-2 border rounded-lg text-sm font-mono font-bold outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email</label>
                    <input type="email" id="cliEmail" placeholder="cliente@email.co.mz" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Endereço Completo / Morada</label>
                    <input type="text" id="cliEndereco" placeholder="Av. Eduardo Mondlane nº 1234, Maputo" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Observações / Preferências</label>
                    <textarea id="cliObs" rows="2" placeholder="Preferência por mesas ao ar livre..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="fecharModal('modalCliente')" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50 cursor-pointer">Cancelar</button>
                    <button type="button" onclick="salvarCliente()" class="px-5 py-2 bg-custom-primary text-white font-bold rounded-lg text-sm shadow hover:opacity-90 cursor-pointer">Gravar Cliente</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
var editandoCliId = null;

function renderClientes() {
    var tbody = document.getElementById('tabelaClientes');
    if (!tbody) return;
    var lista = window.RestauranteApp.clientes || [];
    var html = '';

    for (var i = 0; i < lista.length; i++) {
        var c = lista[i];
        var cod = c.codigo || ('CLI-0' + (i + 1));
        var nuit = c.nuit || c.nif || '9999999999';
        var end = c.endereco || c.morada || 'Maputo';
        html += '<tr class="hover:bg-gray-50">';
        html += '  <td class="p-4 font-mono font-bold text-xs text-gray-500">' + cod + '</td>';
        html += '  <td class="p-4 font-bold text-gray-900">' + c.nome + '</td>';
        html += '  <td class="p-4 font-mono text-xs font-semibold text-emerald-700">' + c.telefone + '</td>';
        html += '  <td class="p-4 font-mono text-xs font-bold text-gray-700"><span class="bg-gray-100 px-2 py-0.5 rounded border font-mono">' + nuit + '</span></td>';
        html += '  <td class="p-4 text-xs text-gray-600">' + end + '</td>';
        html += '  <td class="p-4 text-xs text-gray-500">' + (c.email || '—') + '</td>';
        html += '  <td class="p-4 text-gray-500 italic text-xs">' + (c.obs || '—') + '</td>';
        html += '  <td class="p-4 text-right space-x-2">';
        html += '    <button onclick="editarCliente(\'' + c.id + '\')" class="text-blue-600 hover:text-blue-800 cursor-pointer font-bold text-xs"><i class="fa-solid fa-pen-to-square"></i></button>';
        html += '    <button onclick="removerCliente(' + i + ')" class="text-red-600 hover:text-red-800 cursor-pointer text-xs"><i class="fa-solid fa-trash"></i></button>';
        html += '  </td>';
        html += '</tr>';
    }
    tbody.innerHTML = html;
}

function abrirModalCliente() {
    editandoCliId = null;
    document.getElementById('modalClienteTitulo').innerText = 'Novo Cliente';
    var next = (window.RestauranteApp.clientes || []).length + 1;
    document.getElementById('cliCodigo').value = 'CLI-0' + next;
    document.getElementById('cliNome').value = '';
    document.getElementById('cliTelefone').value = '';
    document.getElementById('cliEmail').value = '';
    document.getElementById('cliNuit').value = '';
    document.getElementById('cliEndereco').value = '';
    document.getElementById('cliObs').value = '';
    abrirModal('modalCliente');
}

function editarCliente(id) {
    var c = (window.RestauranteApp.clientes || []).find(function(item) { return item.id === id; });
    if (!c) return;
    editandoCliId = id;
    document.getElementById('modalClienteTitulo').innerText = 'Editar Cliente';
    document.getElementById('cliCodigo').value = c.codigo || ('CLI-0' + id);
    document.getElementById('cliNome').value = c.nome;
    document.getElementById('cliTelefone').value = c.telefone;
    document.getElementById('cliEmail').value = c.email || '';
    document.getElementById('cliNuit').value = c.nuit || c.nif || '';
    document.getElementById('cliEndereco').value = c.endereco || c.morada || '';
    document.getElementById('cliObs').value = c.obs || '';
    abrirModal('modalCliente');
}

function salvarCliente() {
    var nome = (document.getElementById('cliNome').value || '').trim();
    var tel = (document.getElementById('cliTelefone').value || '').trim();
    var nuit = (document.getElementById('cliNuit').value || '').trim();
    var endereco = (document.getElementById('cliEndereco').value || '').trim();
    var cod = (document.getElementById('cliCodigo').value || '').trim();

    if (!nome) { 
        if (window.mostrarMensagemAmigavel) window.mostrarMensagemAmigavel('Informe o nome do cliente.', 'Campo Obrigatório', 'aviso');
        else alert('Informe o nome do cliente.');
        return; 
    }

    // Se informou NUIT, valida ou completa 10 dígitos numéricos
    var nuitNumerico = nuit ? nuit.replace(/[^0-9]/g, '') : '';
    if (nuit && nuitNumerico.length !== 10) {
        if (window.mostrarMensagemAmigavel) {
            window.mostrarMensagemAmigavel('O NUIT informado possui ' + nuitNumerico.length + ' dígitos. Um NUIT regular possui 10 dígitos (Ex: 4001234567).\n\nCorrija ou deixe em branco.', 'Atenção ao NUIT', 'aviso');
        } else {
            alert('O NUIT deve conter 10 dígitos ou ficar em branco.');
        }
        return;
    }

    if (!nuitNumerico) {
        nuitNumerico = '9999999999';
    }

    var item = {
        codigo: cod || ('CLI-0' + ((window.RestauranteApp.clientes || []).length + 1)),
        nome: nome,
        telefone: tel || '+258 84 000 0000',
        email: (document.getElementById('cliEmail').value || '').trim(),
        nuit: nuitNumerico,
        nif: nuitNumerico,
        endereco: endereco || 'Maputo',
        morada: endereco || 'Maputo',
        obs: (document.getElementById('cliObs').value || '').trim()
    };

    if (!window.RestauranteApp.clientes) window.RestauranteApp.clientes = [];

    if (editandoCliId) {
        var idx = window.RestauranteApp.clientes.findIndex(function(x) { return x.id === editandoCliId; });
        if (idx !== -1) {
            item.id = editandoCliId;
            window.RestauranteApp.clientes[idx] = item;
        }
    } else {
        item.id = String(Date.now());
        window.RestauranteApp.clientes.push(item);
    }

    // 1. FECHA IMEDIATAMENTE A MODAL
    fecharModal('modalCliente');
    renderClientes();

    // 2. GRAVA NO LOCALSTORAGE E BASE DE DADOS SUPABASE / POSTGRESQL
    if (window.RestauranteApp.salvarEstado) {
        window.RestauranteApp.salvarEstado();
    }

    // 3. EXIBE AVALIAÇÃO DE SUCESSO (Com fecho garantido do diálogo)
    if (window.mostrarMensagemAmigavel) {
        window.mostrarMensagemAmigavel('Cliente "' + nome + '" gravado com sucesso!\n\nDados registados na base de dados.', 'Cliente Gravado', 'sucesso');
    }
}

function removerCliente(idx) {
    var msg = 'Deseja realmente remover este cliente?';
    if (window.confirmarAcaoAmigavel) {
        window.confirmarAcaoAmigavel(msg, 'Remover Cliente', function() {
            window.RestauranteApp.clientes.splice(idx, 1);
            if (window.RestauranteApp.salvarEstado) window.RestauranteApp.salvarEstado();
            renderClientes();
        });
    } else if (confirm(msg)) {
        window.RestauranteApp.clientes.splice(idx, 1);
        if (window.RestauranteApp.salvarEstado) window.RestauranteApp.salvarEstado();
        renderClientes();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    renderClientes();
});
</script>
{% endblock %}
