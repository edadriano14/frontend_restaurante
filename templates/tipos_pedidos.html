{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Tipos de Pedidos</h1>
            <p class="text-gray-500">Configuração das modalidades de atendimento: Balcão, Takeaway, Delivery, Encomenda.</p>
        </div>
        <button onclick="abrirModalTipoPedido()" class="px-4 py-2 bg-custom-primary text-white rounded-lg font-semibold shadow hover:opacity-90 flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-plus"></i> Novo Tipo de Pedido
        </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-50 text-gray-700 uppercase font-semibold text-xs border-b">
                <tr>
                    <th class="p-4">Código</th>
                    <th class="p-4">Descrição</th>
                    <th class="p-4 text-right">Acções</th>
                </tr>
            </thead>
            <tbody id="tabelaTiposPedidos" class="divide-y divide-gray-100"></tbody>
        </table>
    </div>

    <!-- Modal Novo Tipo de Pedido -->
    <div id="modalTipoPedido" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 id="modalTipoTitulo" class="font-bold text-lg text-gray-800">Novo Tipo de Pedido</h3>
                <button type="button" onclick="fecharModal('modalTipoPedido')" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Código *</label>
                    <input type="text" id="tipoCodigo" placeholder="TP-MESA" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Descrição *</label>
                    <input type="text" id="tipoDescricao" placeholder="Ex: Consumo na Mesa / Esplanada" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                </div>
                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="fecharModal('modalTipoPedido')" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50 cursor-pointer">Cancelar</button>
                    <button type="button" onclick="salvarTipoPedido()" class="px-5 py-2 bg-custom-primary text-white font-bold rounded-lg text-sm shadow hover:opacity-90 cursor-pointer">Gravar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
var editandoTipoId = null;

function renderTiposPedidos() {
    var tbody = document.getElementById('tabelaTiposPedidos');
    if (!tbody) return;
    var lista = window.RestauranteApp.tipos_pedidos;
    var html = '';

    for (var i = 0; i < lista.length; i++) {
        var t = lista[i];
        html += '<tr class="hover:bg-gray-50">';
        html += '  <td class="p-4 font-mono font-bold text-gray-700">' + t.codigo + '</td>';
        html += '  <td class="p-4 font-bold text-gray-900">' + t.descricao + '</td>';
        html += '  <td class="p-4 text-right space-x-2">';
        html += '    <button onclick="editarTipoPedido(\'' + t.id + '\')" class="text-blue-600 hover:text-blue-800 cursor-pointer"><i class="fa-solid fa-pen-to-square"></i></button>';
        html += '    <button onclick="removerTipoPedido(' + i + ')" class="text-red-600 hover:text-red-800 cursor-pointer"><i class="fa-solid fa-trash"></i></button>';
        html += '  </td>';
        html += '</tr>';
    }
    tbody.innerHTML = html;
}

function abrirModalTipoPedido() {
    editandoTipoId = null;
    document.getElementById('modalTipoTitulo').innerText = 'Novo Tipo de Pedido';
    document.getElementById('tipoCodigo').value = 'TP-0' + (window.RestauranteApp.tipos_pedidos.length + 1);
    document.getElementById('tipoDescricao').value = '';
    abrirModal('modalTipoPedido');
}

function editarTipoPedido(id) {
    var t = window.RestauranteApp.tipos_pedidos.find(function(item) { return item.id === id; });
    if (!t) return;
    editandoTipoId = id;
    document.getElementById('modalTipoTitulo').innerText = 'Editar Tipo de Pedido';
    document.getElementById('tipoCodigo').value = t.codigo;
    document.getElementById('tipoDescricao').value = t.descricao;
    abrirModal('modalTipoPedido');
}

function salvarTipoPedido() {
    var codigo = document.getElementById('tipoCodigo').value;
    var desc = document.getElementById('tipoDescricao').value;
    if (!codigo || !desc) { alert('Código e Descrição são obrigatórios.'); return; }

    var item = { codigo: codigo, descricao: desc };

    if (editandoTipoId) {
        var idx = window.RestauranteApp.tipos_pedidos.findIndex(function(x) { return x.id === editandoTipoId; });
        if (idx !== -1) {
            item.id = editandoTipoId;
            window.RestauranteApp.tipos_pedidos[idx] = item;
        }
    } else {
        item.id = String(Date.now());
        window.RestauranteApp.tipos_pedidos.push(item);
    }

    fecharModal('modalTipoPedido');
    renderTiposPedidos();
    alert('Tipo de pedido gravado com sucesso!');
}

function removerTipoPedido(idx) {
    if (confirm('Deseja remover este tipo de pedido?')) {
        window.RestauranteApp.tipos_pedidos.splice(idx, 1);
        renderTiposPedidos();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    renderTiposPedidos();
});
</script>
{% endblock %}
