<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sessão - {{ estabelecimento.nome }}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="theme-color" content="{{ estabelecimento.cor_primaria }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --cor-primaria: {{ estabelecimento.cor_primaria }};
            --cor-secundaria: {{ estabelecimento.cor_secundaria }};
        }
        .bg-custom-primary { background-color: var(--cor-primaria); }
        .text-custom-primary { color: var(--cor-primaria); }
        .border-custom-primary { border-color: var(--cor-primaria); }
        .bg-restaurant {
            background-image: linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.82)),
                              url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-restaurant min-h-screen flex items-center justify-center p-4 font-sans antialiased text-gray-800">

    <!-- Card de Login Limpo, Moderno e Bonito -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 sm:p-10 border border-white/40 transition-all">
        
        <!-- Cabeçalho / Identidade -->
        <div class="text-center mb-8">
            {% if estabelecimento.logotipo_url %}
            <img src="{{ estabelecimento.logotipo_url }}" alt="Logo" class="w-16 h-16 rounded-2xl object-cover mx-auto mb-3 shadow-lg border-2 border-white">
            {% else %}
            <div class="w-14 h-14 rounded-2xl bg-custom-primary text-white flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl font-black">
                <i class="fa-solid fa-utensils"></i>
            </div>
            {% endif %}
            <h1 class="text-2xl font-black text-gray-900 tracking-tight">{{ estabelecimento.nome }}</h1>
            <p class="text-sm text-gray-500 mt-1">Introduza os seus dados para iniciar sessão</p>
        </div>

        {% if erro %}
        <div class="mb-5 p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-center gap-2.5">
            <i class="fa-solid fa-circle-exclamation text-red-600 text-base flex-shrink-0"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        {% if mensagem %}
        <div class="mb-5 p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold flex items-center gap-2.5">
            <i class="fa-solid fa-circle-check text-emerald-600 text-base flex-shrink-0"></i>
            <span>{{ mensagem }}</span>
        </div>
        {% endif %}

        <!-- Formulário de Login Direto: Utilizador e Palavra-passe -->
        <form id="formLogin" method="POST" action="/auth/login" class="space-y-5">
            <input type="hidden" name="next" value="{{ next_url or '/' }}">

            <!-- Utilizador / Email -->
            <div>
                <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Utilizador ou Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="email" name="email" required value="{{ email_preenchido or '' }}" placeholder="ex: admin@restaurante.com" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm outline-none focus:bg-white focus:border-custom-primary focus:ring-4 focus:ring-red-500/10 transition">
                </div>
            </div>

            <!-- Password com Botão Olho -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Password</label>
                    <a href="/recuperar-senha" class="text-xs font-semibold text-custom-primary hover:underline">Esqueceu a password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm outline-none focus:bg-white focus:border-custom-primary focus:ring-4 focus:ring-red-500/10 transition font-mono">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-700 cursor-pointer transition" title="Ver/Ocultar Password">
                        <i id="iconeOlho" class="fa-solid fa-eye text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Botão Entrar -->
            <button type="submit" class="w-full py-3.5 bg-custom-primary hover:opacity-95 text-white font-bold rounded-2xl shadow-lg shadow-red-600/20 transition flex items-center justify-center gap-2 text-sm cursor-pointer mt-2">
                <span>Entrar no Sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="text-center mt-6 pt-5 border-t border-gray-100">
            <a href="/portal-cliente" class="text-xs text-gray-500 hover:text-gray-900 font-medium inline-flex items-center gap-1.5 transition">
                <i class="fa-solid fa-mobile-screen-button text-gray-400"></i>
                Ir para o Portal do Cliente
            </a>
        </div>
    </div>

    <script>
        function togglePassword() {
            var input = document.getElementById('password');
            var icon = document.getElementById('iconeOlho');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
