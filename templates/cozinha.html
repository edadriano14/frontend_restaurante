{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Cabeçalho -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white rounded-2xl shadow-sm p-6 border-l-4 border-orange-600">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-kitchen-set text-orange-600"></i> Painel da Cozinha (KDS)
            </h1>
            <p class="text-gray-500 mt-1">Gestão em tempo real dos pedidos enviados da cozinha, com actualização instantânea do estado de confecção.</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="abrirModalNovoPedidoCozinha()" class="px-4 py-2 bg-orange-600 text-white rounded-xl text-xs font-bold shadow hover:bg-orange-700 flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-plus-circle"></i> Criar Pedido Manual
            </button>
            <button onclick="renderPainelCozinha()" class="p-2 bg-gray-100 rounded-xl text-gray-600 hover:text-gray-900 cursor-pointer" title="Actualizar">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </div>
    </div>

    <!-- Filtros de Estado da Cozinha -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-2">
            <button onclick="filtrarCozinha('TODOS')" id="btnFiltroCz-TODOS" class="filtro-cz-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-orange-600 text-white shadow-sm cursor-pointer">
                Pedidos Ativos
            </button>
            <button onclick="filtrarCozinha('PENDENTE')" id="btnFiltroCz-PENDENTE" class="filtro-cz-btn px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-100 cursor-pointer flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span> Pendentes
            </button>
            <button onclick="filtrarCozinha('EM_PREPARACAO')" id="btnFiltroCz-EM_PREPARACAO" class="filtro-cz-btn px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-100 cursor-pointer flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span> Em Preparação
            </button>
            <button onclick="filtrarCozinha('PRONTO')" id="btnFiltroCz-PRONTO" class="filtro-cz-btn px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-100 cursor-pointer flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Prontos para Servir
            </button>
            <button onclick="filtrarCozinha('ENTREGUE')" id="btnFiltroCz-ENTREGUE" class="filtro-cz-btn px-3 py-1.5 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-100 cursor-pointer flex items-center gap-1.5">
                <i class="fa-solid fa-clock-rotate-left text-gray-400"></i> Histórico (Entregues)
            </button>
        </div>
        <div class="text-xs text-gray-500 font-semibold" id="contadorCozinha">
            0 pedidos activos
        </div>
    </div>

    <!-- Grade de Comandas / Pedidos KDS -->
    <div id="gradePedidosCozinha" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Preenchido via renderPainelCozinha() -->
    </div>

    <!-- Modal Novo Pedido Manual para a Cozinha -->
    <div id="modalNovoPedidoCozinha" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-lg text-gray-800">Enviar Pedido para Cozinha</h3>
                <button type="button" onclick="fecharModal('modalNovoPedidoCozinha')" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Mesa / Localização *</label>
                    <input type="text" id="czNovoLocal" placeholder="Ex: Mesa 05 - Esplanada" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Tipo de Pedido</label>
                    <select id="czNovoTipo" class="w-full px-3 py-2 border rounded-lg text-sm outline-none bg-white">
                        <option value="Mesa">Mesa</option>
                        <option value="Takeaway">Takeaway</option>
                        <option value="Delivery">Delivery</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Produto a Preparar *</label>
                    <select id="czNovoProdSelect" class="w-full px-3 py-2 border rounded-lg text-sm outline-none bg-white font-semibold">
                        <!-- Preenchido via preencherSelectProdutos() -->
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Quantidade *</label>
                        <input type="number" id="czNovoQtd" min="1" value="1" class="w-full px-3 py-2 border rounded-lg text-sm outline-none font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Posto de Preparação</label>
                        <select id="czNovoPosto" class="w-full px-3 py-2 border rounded-lg text-sm outline-none bg-white">
                            <option value="Cozinha Principal">Cozinha Principal</option>
                            <option value="Grelha & Churrasqueira">Grelha & Churrasqueira</option>
                            <option value="Pastelaria & Sobremesas">Pastelaria & Sobremesas</option>
                            <option value="Bar & Bebidas">Bar & Bebidas</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Instruções de Cozinha / Ponto da Carne</label>
                    <input type="text" id="czNovoObs" placeholder="Ex: Ponto da carne bem passado, sem sal" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                </div>
                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="fecharModal('modalNovoPedidoCozinha')" class="px-4 py-2 border rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50 cursor-pointer">Cancelar</button>
                    <button type="button" onclick="salvarNovoPedidoCozinha()" class="px-5 py-2 bg-orange-600 text-white rounded-lg text-xs font-bold shadow hover:bg-orange-700 cursor-pointer">Enviar para Cozinha</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
var filtroCozinhaAtual = 'TODOS';

function renderPainelCozinha() {
    var container = document.getElementById('gradePedidosCozinha');
    var contador = document.getElementById('contadorCozinha');
    if (!container) return;

    var lista = window.RestauranteApp.pedidos_cozinha || [];
    if (filtroCozinhaAtual === 'TODOS') {
        // Por padrão no painel ativo, pedidos já entregues saem da visão principal e ficam apenas no histórico
        lista = lista.filter(function(p) { return p.estado !== 'ENTREGUE'; });
    } else {
        lista = lista.filter(function(p) { return p.estado === filtroCozinhaAtual; });
    }

    var html = '';
    for (var i = 0; i < lista.length; i++) {
        var p = lista[i];

        var corBorda = 'border-amber-400';
        var corHeader = 'bg-amber-50 text-amber-900';
        var badgeEstado = '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-amber-100 text-amber-800 flex items-center gap-1"><i class="fa-solid fa-clock"></i> Pendente</span>';

        if (p.estado === 'EM_PREPARACAO') {
            corBorda = 'border-blue-500';
            corHeader = 'bg-blue-50 text-blue-900';
            badgeEstado = '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-800 flex items-center gap-1"><i class="fa-solid fa-fire animate-pulse text-orange-500"></i> Em Preparação</span>';
        } else if (p.estado === 'PRONTO') {
            corBorda = 'border-emerald-500';
            corHeader = 'bg-emerald-50 text-emerald-900';
            badgeEstado = '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1"><i class="fa-solid fa-check"></i> Pronto para Servir</span>';
        } else if (p.estado === 'ENTREGUE') {
            corBorda = 'border-gray-300';
            corHeader = 'bg-gray-100 text-gray-700';
            badgeEstado = '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-gray-200 text-gray-700 flex items-center gap-1"><i class="fa-solid fa-utensils"></i> Entregue</span>';
        }

        html += '<div class="bg-white rounded-2xl shadow-sm border-2 ' + corBorda + ' overflow-hidden flex flex-col justify-between">';
        html += '  <div>';
        html += '    <div class="p-4 ' + corHeader + ' flex items-center justify-between border-b">';
        html += '      <div>';
        html += '        <span class="text-xs font-mono font-black">' + p.numero + '</span>';
        html += '        <h3 class="font-bold text-sm text-gray-900">' + p.localizacao + '</h3>';
        html += '      </div>';
        html += '      <div class="text-right">';
        html += '        <div class="text-[11px] font-mono font-bold text-gray-700 bg-white/80 px-2 py-0.5 rounded border border-gray-200 flex items-center gap-1 justify-end shadow-sm" title="Hora exata de envio"><i class="fa-regular fa-clock text-blue-600"></i> Enviado: ' + (p.hora_envio || p.hora) + '</div>';
        html += '        <span class="text-[10px] font-bold uppercase text-gray-400 mt-0.5 block">' + p.tipo + '</span>';
        html += '      </div>';
        html += '    </div>';

        html += '    <div class="p-4 space-y-2.5">';
        (p.itens || []).forEach(function(it) {
            html += '<div class="p-2.5 bg-gray-50 rounded-xl border border-gray-100 flex items-start justify-between gap-2">';
            html += '  <div>';
            html += '    <div class="font-bold text-xs text-gray-900">' + it.qtd + 'x ' + it.nome + '</div>';
            if (it.opcoes) {
                html += '  <div class="text-[11px] text-orange-700 font-semibold mt-0.5"><i class="fa-solid fa-circle-dot text-[9px] mr-1"></i>' + it.opcoes + '</div>';
            }
            html += '  </div>';
            if (it.posto) {
                html += '  <span class="text-[10px] bg-white px-2 py-0.5 rounded border border-gray-200 text-gray-600 font-mono shrink-0">' + it.posto + '</span>';
            }
            html += '</div>';
        });
        html += '    </div>';
        html += '  </div>';

        // Rodapé de Ações de Estado
        html += '  <div class="p-4 border-t bg-gray-50/50 flex items-center justify-between gap-2">';
        html += '    <div>' + badgeEstado + '</div>';
        html += '    <div class="flex items-center gap-1.5">';

        if (p.estado === 'PENDENTE') {
            html += '    <button onclick="mudarEstadoPedidoCozinha(\'' + p.id + '\', \'EM_PREPARACAO\')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-fire"></i> Iniciar</button>';
        } else if (p.estado === 'EM_PREPARACAO') {
            html += '    <button onclick="mudarEstadoPedidoCozinha(\'' + p.id + '\', \'PRONTO\')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-bell"></i> Pronto!</button>';
        } else if (p.estado === 'PRONTO') {
            html += '    <button onclick="mudarEstadoPedidoCozinha(\'' + p.id + '\', \'ENTREGUE\')" class="px-3 py-1.5 bg-gray-800 hover:bg-black text-white rounded-lg text-xs font-bold shadow flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-check-double"></i> Entregar</button>';
        } else {
            html += '    <button onclick="mudarEstadoPedidoCozinha(\'' + p.id + '\', \'EM_PREPARACAO\')" class="px-2 py-1 border text-gray-600 hover:bg-gray-100 rounded text-[11px] cursor-pointer">Reabrir</button>';
        }

        html += '    </div>';
        html += '  </div>';
        html += '</div>';
    }

    container.innerHTML = html || '<div class="col-span-full p-12 text-center text-gray-400 text-sm bg-white rounded-2xl border border-gray-100"><i class="fa-solid fa-circle-check text-4xl text-emerald-400 mb-2"></i><p class="font-bold text-gray-700">Sem pedidos pendentes na cozinha!</p><p class="text-xs text-gray-400 mt-1">Todos os pedidos foram confeccionados e entregues.</p></div>';
    if (contador) contador.innerText = lista.length + ' pedidos no ecrã';
}

function filtrarCozinha(estado) {
    filtroCozinhaAtual = estado;
    var botoes = document.querySelectorAll('.filtro-cz-btn');
    botoes.forEach(function(b) {
        b.classList.remove('bg-orange-600', 'text-white', 'shadow-sm');
        b.classList.add('text-gray-600', 'hover:bg-gray-100');
    });
    var ativo = document.getElementById('btnFiltroCz-' + estado);
    if (ativo) {
        ativo.classList.add('bg-orange-600', 'text-white', 'shadow-sm');
        ativo.classList.remove('text-gray-600', 'hover:bg-gray-100');
    }
    renderPainelCozinha();
}

function mudarEstadoPedidoCozinha(id, novoEstado) {
    var p = (window.RestauranteApp.pedidos_cozinha || []).find(function(x) { return x.id === id; });
    if (!p) return;
    p.estado = novoEstado;

    if (novoEstado === 'ENTREGUE') {
        p.data_hora_entrega = new Date().toLocaleString('pt-PT');
        if (!window.RestauranteApp.historico_expedicao) {
            window.RestauranteApp.historico_expedicao = [];
        }
        window.RestauranteApp.historico_expedicao.unshift({
            id: String(Date.now()),
            comanda_numero: p.numero,
            localizacao: p.localizacao,
            tipo_expedicao: (p.tipo || 'Cozinha').toUpperCase(),
            data_hora: p.data_hora_entrega,
            motorista: p.motorista_responsavel || 'Expedido pela Cozinha / Bar',
            itens: JSON.parse(JSON.stringify(p.itens || []))
        });
    }

    if (window.RestauranteApp.salvarEstado) {
        window.RestauranteApp.salvarEstado();
    }
    renderPainelCozinha();
}

function abrirModalNovoPedidoCozinha() {
    var sel = document.getElementById('czNovoProdSelect');
    if (sel) {
        var prods = window.RestauranteApp.produtos || [];
        sel.innerHTML = prods.map(function(p) {
            return '<option value="' + p.nome + '" data-posto="' + (p.posto_nome || 'Cozinha Principal') + '">' + p.nome + '</option>';
        }).join('');
    }
    document.getElementById('czNovoLocal').value = 'Mesa 01';
    document.getElementById('czNovoObs').value = '';
    document.getElementById('czNovoQtd').value = '1';
    abrirModal('modalNovoPedidoCozinha');
}

function salvarNovoPedidoCozinha() {
    var local = document.getElementById('czNovoLocal').value.trim();
    var tipo = document.getElementById('czNovoTipo').value;
    var prodNome = document.getElementById('czNovoProdSelect').value;
    var qtd = parseInt(document.getElementById('czNovoQtd').value) || 1;
    var posto = document.getElementById('czNovoPosto').value;
    var obs = document.getElementById('czNovoObs').value.trim();

    if (!local || !prodNome) {
        alert('Informe a localização e o produto.');
        return;
    }

    if (!window.RestauranteApp.pedidos_cozinha) window.RestauranteApp.pedidos_cozinha = [];

    var num = 'CZ-' + Math.floor(100 + Math.random() * 900);
    window.RestauranteApp.pedidos_cozinha.unshift({
        id: String(Date.now()),
        numero: num,
        origem: 'Manual',
        tipo: tipo,
        localizacao: local,
        hora: new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }),
        estado: 'PENDENTE',
        itens: [
            { nome: prodNome, qtd: qtd, opcoes: obs, posto: posto }
        ]
    });

    fecharModal('modalNovoPedidoCozinha');
    renderPainelCozinha();
    alert('Pedido ' + num + ' enviado para a Cozinha com sucesso!');
}

document.addEventListener('DOMContentLoaded', function() {
    renderPainelCozinha();
});
</script>
{% endblock %}
